name: Publicar en X

# Tres Empanadas: shows confirmados 2 dias antes y el post del lunes, a las 18:00 ART.
# Publica en X a traves de Buffer (plan gratis). Necesita el secret
# BUFFER_API_KEY (vence al año: se regenera en publish.buffer.com/settings/api).
# Scripts en .github/x/. Si un dia falla, ese dia no sale nada y listo.
#
# "Run workflow" a mano con "prueba" tildado: muestra el texto y verifica la
# clave contra Buffer, sin publicar.

on:
  schedule:
    - cron: "20 20 * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Prueba en seco (no publica)"
        type: boolean
        default: true
      fecha:
        description: "Fecha a simular (AAAA-MM-DD, opcional)"
        required: false

permissions:
  contents: read

concurrency:
  group: publicar-x
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/x
            data/eventos
      - name: Publicar
        working-directory: .github/x
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba && '1' || '' }}
        run: |
          if [ -n "$DRY_RUN" ]; then
            python3 -c "import buffer_x,sys; sys.exit(0 if buffer_x.verificar('6af9e12dece6dfde5fd49552') else 1)" || true
          fi
          python3 tres_x.py --eventos ../../data/eventos ${{ inputs.fecha && format('--fecha {0}', inputs.fecha) || '' }}
