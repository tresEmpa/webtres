<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pedidos Tres Empanadas</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#B33227">
    <style>
        :root { 
            --rojo: #8B0000; --oro: #FFEB75; --gris: #f4f4f4; --verde: #00A335; --azul: #0056b3; --naranja: #FF8C00; 
            --bg-empanada: #e8f5e9; --border-empanada: #4caf50;
            --bg-cerveza: #fffde7; --border-cerveza: #fbc02d;
            --bg-snack: #fff3e0; --border-snack: #ff9800;
            --bg-gaseosa: #e3f2fd; --border-gaseosa: #2196f3;
        }
        * { box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--gris); margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .header { background: var(--rojo); color: var(--oro); padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 10px; font-weight: bold; font-size: 1.2rem; }

        /* Input mesa */
        .mesa-input { width: 100%; padding: 15px; font-size: 1.5rem; border-radius: 8px; border: 2px solid #ccc; text-align: center; margin-bottom: 6px; background: white; font-weight: bold; text-transform: uppercase; }
        .mesa-input::placeholder { color: #d1d1d1; font-weight: normal; font-size: 1.1rem; }

        /* Mesas abiertas */
        .mesas-wrap { margin-bottom: 8px; }
        .mesas-titulo { font-size: 0.75rem; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; text-align: center; }
        .mesas-lista { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 36px; }
        .mesa-btn { background: var(--rojo); color: var(--oro); border: none; border-radius: 6px; padding: 6px 14px; font-weight: bold; font-size: 0.9rem; cursor: pointer; text-transform: uppercase; }
        .mesa-btn.activa { background: var(--azul); }
        .mesas-empty { font-size: 0.82rem; color: #bbb; align-self: center; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; overflow-y: auto; flex-grow: 1; padding-bottom: 170px; }
        .card { background: white; padding: 15px 5px; border-radius: 10px; border-bottom: 4px solid #ddd; display: flex; flex-direction: column; align-items: center; position: relative; border-left: 5px solid transparent; }
        .card:active { background: #eee; transform: translateY(2px); border-bottom: 0; }
        .card span { font-weight: bold; font-size: 0.9rem; text-align: center; color: #333; margin-bottom: 4px; }
        .card small { color: #666; font-weight: bold; }

        .card-empanada { border-left-color: var(--border-empanada); background-color: var(--bg-empanada); }
        .card-cerveza { border-left-color: var(--border-cerveza); background-color: var(--bg-cerveza); }
        .card-snack { border-left-color: var(--border-snack); background-color: var(--bg-snack); }
        .card-gaseosa { border-left-color: var(--border-gaseosa); background-color: var(--bg-gaseosa); }

        .badge { position: absolute; top: -5px; right: -5px; background: var(--rojo); color: white; border-radius: 50%; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; border: 2px solid white; font-weight: bold; }
        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding: 10px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); }
        .row { display: flex; gap: 5px; margin-bottom: 8px; }
        button { border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; }
        .btn-l { background: #666; padding: 15px; flex: 1; }
        .btn-c { background: var(--azul); padding: 15px; flex: 1; }
        .btn-p { background: var(--naranja); padding: 15px; flex: 1; }
        .btn-send { background: var(--verde); padding: 18px; width: 100%; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="header">PEDIDOS</div>
<input type="text" id="codMesa" class="mesa-input" placeholder="NUEVA MESA (Ej: M FLORENCIA X3)">
<div class="mesas-wrap">
    <div class="mesas-titulo">Mesas abiertas</div>
    <div class="mesas-lista" id="mesasLista"><span class="mesas-empty">Cargando...</span></div>
</div>

<div class="grid" id="grid"></div>

<div class="footer">
    <div class="row">
        <button class="btn-l" onclick="resetear()">BORRAR</button>
        <button class="btn-c" onclick="verCuenta()">CUENTA</button>
        <button class="btn-p" onclick="cerrarMesa()">PAGÓ</button>
    </div>
    <button class="btn-send" id="btnSend" onclick="enviar()">CARGAR PEDIDO: $0</button>
</div>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxcBbPP2e8G2xFVY8tlUj2PZmqM0kZ2LODaUOv6JmRDSFEmCAokViX9oXLHz0HoYtnzSA/exec";
    
    const productos = [
        {n: "Bondiola", p: 3000, g: "empanada"}, {n: "Jamon y Queso", p: 3000, g: "empanada"}, {n: "Calabaza", p: 3000, g: "empanada"},
        {n: "Rubia Kolsch", p: 6000, g: "cerveza"}, {n: "Negra Stout", p: 6000, g: "cerveza"}, {n: "Golden Honey", p: 6000, g: "cerveza"},
        {n: "Vienna Lager", p: 6000, g: "cerveza"}, {n: "IPA", p: 6000, g: "cerveza"}, {n: "Budweiser Lata", p: 4500, g: "cerveza"},
        {n: "Cerveza SIN", p: 4500, g: "cerveza"},
        {n: "Maní", p: 2500, g: "snack"}, {n: "Papitas", p: 2500, g: "snack"}, {n: "Conitos de Queso", p: 2500, g: "snack"},
        {n: "Agua", p: 3500, g: "gaseosa"}, {n: "Pomelo", p: 4000, g: "gaseosa"}, {n: "Coca-Cola", p: 4000, g: "gaseosa"}, 
        {n: "Naranja", p: 4000, g: "gaseosa"}, {n: "Sprite/7UP", p: 4000, g: "gaseosa"}, {n: "Coca Sin Azucar", p: 4000, g: "gaseosa"}, 
        {n: "7UP Sin Azucar", p: 4000, g: "gaseosa"}
    ];

    let carrito = {}; let total = 0;

    // Cargar mesas abiertas al iniciar y cada 30 segundos
    async function cargarMesas() {
        try {
            const res = await fetch(URL_SCRIPT);
            const d = await res.json();
            const lista = document.getElementById('mesasLista');
            const mesaActual = document.getElementById('codMesa').value.trim().toUpperCase();
            if (!d.mesas || d.mesas.length === 0) {
                lista.innerHTML = '<span class="mesas-empty">Sin mesas abiertas</span>';
            } else {
                lista.innerHTML = '';
                d.mesas.forEach(m => {
                    const btn = document.createElement('button');
                    btn.className = 'mesa-btn' + (m === mesaActual ? ' activa' : '');
                    btn.textContent = m;
                    btn.onclick = () => {
                        document.getElementById('codMesa').value = m;
                        document.querySelectorAll('.mesa-btn').forEach(b => b.classList.remove('activa'));
                        btn.classList.add('activa');
                    };
                    lista.appendChild(btn);
                });
            }
        } catch(e) {
            document.getElementById('mesasLista').innerHTML = '<span class="mesas-empty">Sin conexión</span>';
        }
    }

    function render() {
        const g = document.getElementById('grid'); g.innerHTML = '';
        productos.forEach(p => {
            const cant = carrito[p.n] || 0;
            const d = document.createElement('div'); 
            d.className = `card card-${p.g}`;
            d.onclick = () => { carrito[p.n] = (carrito[p.n] || 0) + 1; total += p.p; render(); };
            d.oncontextmenu = (e) => { e.preventDefault(); if(carrito[p.n]>0){ carrito[p.n]--; total -= p.p; render(); }};
            d.innerHTML = `<span>${p.n}</span><small>$${p.p}</small>${cant>0?`<div class="badge">${cant}</div>`:''}`;
            g.appendChild(d);
        });
        document.getElementById('btnSend').innerText = `CARGAR PEDIDO: $${total}`;
    }

    function resetear() { carrito = {}; total = 0; document.getElementById('codMesa').value = ''; render(); cargarMesas(); }

    async function enviar() {
        const m = document.getElementById('codMesa').value.trim();
        if (!m || total === 0) return alert("Falta código de mesa o productos");
        const mesaUp = m.toUpperCase();
        const b = document.getElementById('btnSend'); b.disabled = true; b.innerText = "ENVIANDO...";
        try {
            await fetch(URL_SCRIPT, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ nombre: mesaUp, items: carrito, total: total, origen: "Barra" })});
            carrito = {}; total = 0; render(); cargarMesas();
            // Confirmación REAL: releemos la mesa y mostramos el total actualizado.
            // Si la relectura trae el total, es que el pedido quedó guardado de verdad.
            let msg = "✅ Cargado a " + mesaUp;
            try {
                const res = await fetch(URL_SCRIPT + "?nombre=" + encodeURIComponent(mesaUp));
                const d = await res.json();
                if (d && d.total != null) msg = "✅ Cargado a " + mesaUp + "\nTotal de la mesa: $" + d.total;
            } catch (e) {
                msg = "Cargado a " + mesaUp + "\n(no pude confirmar el total; revisá con CUENTA)";
            }
            alert(msg);
        } catch (e) {
            alert("⚠️ Error de conexión — el pedido NO se cargó.\nProbá de nuevo.");
        }
        finally { b.disabled = false; render(); }
    }

    async function verCuenta() {
        const m = document.getElementById('codMesa').value.trim();
        if (!m) return alert("Seleccioná o ingresá una mesa");
        try {
            const res = await fetch(URL_SCRIPT + "?nombre=" + encodeURIComponent(m.toUpperCase()));
            const d = await res.json();
            alert("TICKET: " + m.toUpperCase() + "\n---\n" + (d.detalle || "Sin consumos") + "\n---\nTOTAL: $" + d.total);
        } catch (e) { alert("Error al consultar el total"); }
    }

    async function cerrarMesa() {
        const m = document.getElementById('codMesa').value.trim();
        if (!m || !confirm("¿Cerrar cuenta de " + m.toUpperCase() + "?")) return;
        try {
            await fetch(URL_SCRIPT, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ nombre: m.toUpperCase(), accion: "CERRAR" })});
            resetear(); alert("Mesa cerrada exitosamente");
        } catch (e) { alert("Error al cerrar"); }
    }

    // Iniciar
    render();
    cargarMesas();
    setInterval(cargarMesas, 30000); // Actualiza mesas cada 30 segundos
</script>
</body>
</html>
