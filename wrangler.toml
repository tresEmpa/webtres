# Configuración de Cloudflare Pages para Tres Empanadas Comedia.
# El sitio se genera con `node build.mjs` en la carpeta ./dist y las funciones
# viven en ./functions (Cloudflare las detecta solas).

name = "tresempanadas"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Las variables sensibles (COCINA_USER, COCINA_PASS_HASH, SESSION_SECRET,
# GITHUB_TOKEN, GITHUB_REPO, GITHUB_BRANCH, APPS_SCRIPT_URL) NO van acá.
# Se cargan en el panel de Cloudflare como "Environment variables / Secrets".

# Sistema de pedidos nuevo. Producción usa su propia base (tres-pedidos-prod);
# las vistas previas (Preview) usan la de pruebas (tres-pedidos).
# Si /carta/ manda a la carta nueva lo decide CARTA_NUEVA en la tabla config (panel → Carta).
[[d1_databases]]
binding = "DB"
database_name = "tres-pedidos-prod"
database_id = "7d27342f-3cd0-4e7e-ab54-cb32224d8f57"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "tres-pedidos"
database_id = "6a9f797b-1770-44dc-a118-c6d0b25e873d"
